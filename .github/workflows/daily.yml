name: AI 变现日报 · 每日自动采集发布

on:
  schedule:
    # GitHub 定时经常延迟 1-5 小时，所以铺三个时间点兜底；当天已有日报会自动跳过
    - cron: '0 19 * * *'    # UTC 19:00 = 北京 03:00（主跑，最坏情况也能在上午出）
    - cron: '0 22 * * *'    # UTC 22:00 = 北京 06:00
    - cron: '30 1 * * *'    # UTC 01:30 = 北京 09:30（补跑）
  workflow_dispatch: {}   # 支持手动触发
  push:
    branches: [main]      # 代码/数据一有推送就自动重新发布 Pages（当天日报已存在时只发布不重采）
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 采集并生成当日日报
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/collect.py

      - name: 提交数据
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "今日无更新（采集被跳过或无新增）"
          else
            git commit -m "daily report $(date -u +%F)"
            git push
          fi

  deploy:
    needs: collect
    if: ${{ always() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
